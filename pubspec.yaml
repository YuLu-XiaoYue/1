name: elf_egg_warehouse
description: 精灵蛋仓库
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  flutter_colorpicker: ^1.1.0
  flutter_slidable: ^3.1.0
  lpinyin: ^2.0.3
  package_info_plus: ^8.0.0
  excel: ^4.0.6
  archive: ^3.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1 # 用于生成 APP 图标

# 图标生成配置
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/bloodlines/
    - assets/medals/
    - assets/nest_types/
    - assets/special_icons/
    - assets/tutorial.txt
    - assets/update_log.txt
    - assets/app_icon.png # 你的 APP 图标
