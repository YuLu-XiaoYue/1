name: elf_egg_warehouse
description: 精灵蛋仓库
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  flutter_colorpicker: ^1.1.0
  flutter_slidable: ^3.1.0
  lpinyin: ^2.0.3
  package_info_plus: ^8.0.0
  excel: ^4.0.6
  archive: ^3.4.10

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bloodlines/
    - assets/medals/
    - assets/nest_types/
    - assets/special_icons/
    - assets/tutorial.txt
    - assets/update_log.txt
