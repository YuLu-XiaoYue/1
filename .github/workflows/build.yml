name: Build Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate missing platform folders
        run: flutter create . --platforms android,windows
      - name: Apply compileSdk patch
        run: cp android.build.gradle.kts android/build.gradle.kts
      - name: Rename App to Chinese
        run: sed -i 's/android:label=".*"/android:label="精灵蛋仓库"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      
      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons
        
      - name: Build APK and Move to Correct Path
        run: |
          flutter build apk --release || true
          mkdir -p build/app/outputs/flutter-apk/
          cp android/app/build/outputs/apk/release/app-release.apk build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate missing platform folders
        run: flutter create . --platforms android,windows
        
      # ======= 核心修复：强制 C++ 编译使用 UTF-8 并写入 Unicode =======
      - name: Fix Window Title and UTF-8 Encoding
        shell: python
        run: |
          import codecs
          # 1. 修改 main.cpp 标题为 Unicode 转义
          with codecs.open('windows/runner/main.cpp', 'r', encoding='utf-8-sig') as f:
              content = f.read()
          content = content.replace('L"elf_egg_warehouse"', 'L"\\u7CBE\\u7075\\u86CB\\u4ED3\\u5E93"')
          with codecs.open('windows/runner/main.cpp', 'w', encoding='utf-8-sig') as f:
              f.write(content)
          
          # 2. 修改 CMakeLists.txt 强制编译器使用 UTF-8
          with codecs.open('windows/CMakeLists.txt', 'r', encoding='utf-8-sig') as f:
              cmake_content = f.read()
          if 'add_compile_options(/utf-8)' not in cmake_content:
              cmake_content = cmake_content.replace('add_subdirectory("runner")', 'add_compile_options(/utf-8)\nadd_subdirectory("runner")')
          with codecs.open('windows/CMakeLists.txt', 'w', encoding='utf-8-sig') as f:
              f.write(cmake_content)
      # ========================================================
      
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      
      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons
        
      - run: flutter build windows --release
      
      - name: Rename EXE and Zip Release
        run: |
          Rename-Item -Path "build\windows\x64\runner\Release\elf_egg_warehouse.exe" -NewName "精灵蛋仓库.exe"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows-app.zip
        
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: windows-app.zip
