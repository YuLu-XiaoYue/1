name: Build Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate missing platform folders
        run: flutter create . --platforms android,windows
      - name: Apply compileSdk patch
        run: |
          cp android.build.gradle.kts android/build.gradle.kts
      - name: Rename App to Chinese
        run: sed -i 's/android:label=".*"/android:label="精灵蛋仓库"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Build APK and Move to Correct Path
        run: |
          flutter build apk --release || true
          mkdir -p build/app/outputs/flutter-apk/
          cp android/app/build/outputs/apk/release/app-release.apk build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate missing platform folders
        run: flutter create . --platforms android,windows
      
      # 修复乱码：使用 Unicode 转义字符，让 C++ 编译器正确识别中文
      - name: Rename Window Title to Chinese (Fix Unicode)
        run: |
          $title = "\u7CBE\u7075\u86CB\u4ED3\u5E93" # 精灵蛋仓库的 Unicode
          (Get-Content windows/runner/main.cpp) | Foreach-Object { $_ -replace 'elf_egg_warehouse', $title } | Set-Content windows/runner/main.cpp
          
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      
      # 构建完成后，把生成的 exe 文件重命名为中文
      - name: Rename EXE and Zip Release
        run: |
          Rename-Item -Path "build\windows\x64\runner\Release\elf_egg_warehouse.exe" -NewName "精灵蛋仓库.exe"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows-app.zip
        
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: windows-app.zip
